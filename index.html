/* ============ Токены (собраны из макета) ============ */
:root {
  color-scheme: light;
  --c-bg: #f0f0f0;        /* фон страницы, разделители */
  --c-surface: #ffffff;   /* карточки, пилюли меню */
  --c-ink: #000000;       /* основной текст */
  --c-ink-soft: #0f0f0f;  /* подписи шагов (в макете — отдельный почти-чёрный) */
  --c-accent: #ff00ff;    /* WB pink 500 */
  --c-accent-soft: #ffccff;
  --c-ph-1: #f4f4f4;
  --c-ph-2: #ececec;

  --f-main: "WB Sans", "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-step: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r-pill: 10px;
  --r-chip: 16px;
  --r-card: 32px;

  --pad: 16px;
  --content: 358px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Дизайн задуман только светлым: тёмная тема повторяет те же значения */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: light; --c-bg:#f0f0f0; --c-surface:#fff; --c-ink:#000; --c-ink-soft:#0f0f0f; }
}
:root[data-theme="dark"] { color-scheme: light; --c-bg:#f0f0f0; --c-surface:#fff; --c-ink:#000; --c-ink-soft:#0f0f0f; }

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--c-bg); }
body {
  margin: 0; background: var(--c-bg); color: var(--c-ink);
  font-family: var(--f-main); font-weight: 400;
  font-synthesis-weight: none; /* пока нет файла WB Sans Medium — не рисуем «фальшивый» жирный */
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overflow-x: clip; /* страница скроллится только вертикально */
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 2px; border-radius: 6px; }

/* Обрезка текстового бокса как в Figma (cap → baseline) там, где браузер умеет */
.t { line-height: .9; text-box: trim-both cap alphabetic; }

/* Типографическая шкала */
.t-12 { font-size: 12px; }
.t-16 { font-size: 16px; }
.t-20 { font-size: 20px; }
.t-40 { font-size: 40px; }
.t-52 { font-size: 52px; }
.medium { font-weight: 500; }
.accent { color: var(--c-accent); }

.page { width: 100%; max-width: calc(var(--content) + var(--pad) * 2); margin: 0 auto; padding: 0 var(--pad); }

/* ============ Шапка ============ */
.header { display: flex; align-items: center; gap: 7px; height: 64px; padding: 12px 8px; }
.header.compact {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  height: 48px; padding: 0 8px; margin: 0 calc(var(--pad) * -1); padding-left: calc(var(--pad) + 8px);
  background: var(--c-bg);
}
body.has-compact::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--c-bg); }
.wb-pill { width: 52px; height: 30.68px; flex: none; display: block; }

/* ============ Меню ============ */
.menu { display: flex; flex-wrap: wrap; gap: 4px; width: 349px; max-width: 100%; }
.menu a {
  display: inline-flex; align-items: center; justify-content: center;
  height: 30px; padding: 0 8px; border-radius: var(--r-pill);
  background: var(--c-surface); color: var(--c-ink);
  font-size: 20px; font-weight: 500; white-space: nowrap;
}
.menu a .t { line-height: 1; }
.menu a[aria-current="page"] { background: var(--c-ink); color: var(--c-surface); }

.stack { display: flex; flex-direction: column; }
.gap-4 { gap: 4px; } .gap-12 { gap: 12px; } .gap-20 { gap: 20px; } .gap-40 { gap: 40px; }

/* ============ Плейсхолдеры картинок ============ */
.ph { position: relative; overflow: hidden; background: repeating-linear-gradient(135deg, var(--c-ph-1) 0 10px, var(--c-ph-2) 10px 20px); }
.ph.has-img { background: none; }
.pic { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; display: block; pointer-events: none; }
.pic.cover { object-fit: cover; } .pic.contain { object-fit: contain; }
.darken { mix-blend-mode: darken; }
.card .inner.r32 .pic { border-radius: 32px; }

/* ============ Главная ============ */
.hero { display: flex; gap: 2px; height: 263px; border-radius: var(--r-card); overflow: hidden; }
.hero .main { flex: 0 0 238px; }
.hero .side { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.hero .side .ph { flex: 1; }
.row-title { display: flex; align-items: flex-end; gap: 12px; }
.row-title > :first-child { min-width: 0; overflow-wrap: break-word; }
.row-title > :last-child { white-space: nowrap; flex: none; }

.tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 8px; row-gap: 12px; padding-bottom: 40px; }
.tile { display: flex; flex-direction: column; gap: 4px; }
.tile .art { display: flex; height: 131px; border-radius: var(--r-card); overflow: hidden; background: var(--c-surface); }
.tile .art .big { flex: 1; }
.tile .art .div-v { width: 2px; background: var(--c-bg); }
.tile .art .col { flex: 0 0 58px; display: flex; flex-direction: column; }
.tile .art .col .ph { flex: 1; }
.tile .art .col .div-h { height: 2px; background: var(--c-bg); }
.tile .label { display: flex; align-items: flex-end; gap: 8px; padding: 4px; }

/* ============ Категория ============ */
.desc { margin: 0; font-size: 40px; line-height: .9; overflow-wrap: break-word; }
.desc u { text-decoration: underline; text-decoration-color: var(--c-accent); text-decoration-thickness: 4px; text-underline-offset: 4px; text-decoration-skip-ink: none; }

.masonry { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 14px; align-items: start; }
.masonry .col { display: flex; flex-direction: column; gap: 14px; }

.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions .btn { width: auto; padding: 0 8px; white-space: nowrap; }
.intro { margin-bottom: -8px; } /* описание → карточки: 32px */
.masonry { column-gap: 12px !important; }
.masonry .col { gap: 12px !important; }
.masonry > .col:first-child { padding-top: 82px; }
.masonry.has-progress > .col:first-child { padding-top: 0; }

/* ===== Тест на «Разукрасках»: счётчик и отметка «сделано» ===== */
.progress-gap { height: 68px; flex: none; }
.progress { height: 68px; flex: none; border-radius: 16px; background: var(--c-surface); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
.progress .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.progress .num { font-size: 20px; font-weight: 500; color: var(--c-accent); }
.progress .bar { height: 8px; border-radius: 10px; background: var(--c-accent-soft); overflow: hidden; }
.progress .bar i { display: block; height: 100%; border-radius: 10px; background: var(--c-accent); transition: width .3s ease; }
.done-btn { position: absolute; z-index: 2; top: 8px; right: 7px; height: 30px; min-width: 30px; padding: 0 8px; border-radius: var(--r-pill); background: var(--c-surface); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: var(--c-ink); cursor: pointer; }
.done-btn .t { line-height: 1; display: none; }
.done-btn svg path { stroke: #c8c8c8; }
/* включено: цвета как у кнопок на карточке, форма как у табов меню */
.card.is-done .done-btn, .zoom-btns .done-btn.on { background: var(--c-accent); color: #fff; padding: 0 8px; }
.card.is-done .done-btn svg path, .zoom-btns .done-btn.on svg path { stroke: #fff; }
.card.is-done .done-btn .t, .zoom-btns .done-btn.on .t { display: inline; }
.card.is-done .inner .pic { filter: grayscale(1); opacity: .5; }
.card.is-done .icons rect { fill: var(--c-accent-soft); }
.card.is-done .frame, .card.is-done .inner { background: #f7f7f7 !important; border-color: #f7f7f7; } /* сдвиг левой колонки как в макете (место бывших кнопок 68 + 14) */
.intro { display: flex; flex-direction: column; }
.intro .actions { margin-top: 20px; }
.intro .desc { margin-top: 24px; }
.sec-head { display: flex; flex-direction: column; gap: 16px; }
.btn {
  height: 30px; width: 100%; border-radius: var(--r-pill); background: var(--c-surface);
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px;
  color: var(--c-accent); font-size: 16px;
}
.btn svg { flex: none; }

.card { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.card .frame { background: var(--c-surface); border-radius: var(--r-card); }
.card .inner { position: relative; border: 6px solid var(--c-surface); border-radius: 16px; overflow: hidden; height: 239px; background: var(--c-surface); }
.card .inner .ph { height: 100%; }
.card .icons { position: absolute; right: 7px; bottom: 8px; display: flex; gap: 4px; }
.card .meta { display: flex; flex-direction: column; gap: 8px; padding: 4px 6px 0; }
.chip { align-self: flex-start; display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--r-chip); background: var(--c-surface); font-size: 16px; }
.chip .t { line-height: 1; }

.ic { width: 36px; height: 36px; border-radius: 50%; display: block; flex: none; }
.ic svg { display: block; }

.section-title { font-size: 40px; }

/* Слайдер «Как подготовить материалы» */
.slider-wrap { position: relative; }
.slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; scrollbar-width: none; overscroll-behavior-x: contain; }
.slider::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 calc(100% - 8px); scroll-snap-align: start; height: 361px; position: relative; background: var(--c-surface); border-radius: var(--r-card); overflow: hidden; }
.slide .ph { position: absolute; inset: 0; }
.dots { position: absolute; top: 24px; left: 24px; display: flex; gap: 4px; z-index: 2; }
.dots i { display: block; width: 14px; height: 8px; border-radius: 10px; background: var(--c-accent-soft); transition: width .25s ease, background .25s ease; }
.dots i.on { width: 60px; background: var(--c-accent); }

/* ============ Деталка оригами ============ */
.title-row { display: flex; align-items: flex-end; gap: 8px; }
.tags { display: flex; gap: 8px; }
.tag { display: inline-flex; align-items: center; height: 30px; padding: 0 8px; border-radius: var(--r-pill); background: var(--c-surface); font-size: 20px; }
.tag .t { line-height: 1; }
.tag.done-tag { gap: 6px; cursor: pointer; font: inherit; font-size: 20px; color: var(--c-ink); }
.tag.done-tag svg path { stroke: #c8c8c8; transition: stroke .2s ease; }
.tag.done-tag { transition: background .2s ease, color .2s ease; }
.tag.done-tag.on { background: var(--c-accent); color: #fff; }
.tag.done-tag.on svg path { stroke: #fff; }
.tag.done-tag .t { display: none; }
.tag.done-tag:not(.on) { min-width: 30px; padding: 0; justify-content: center; }
.tag.done-tag.on .t { display: inline; }
.ic.loading, .btn.loading { opacity: .5; pointer-events: none; }

.steps { display: flex; flex-direction: column; }
.step { position: relative; height: 361px; border-radius: var(--r-card); overflow: hidden; background: var(--c-surface); }
.step .ph { position: absolute; inset: 0; }
.step .num { position: absolute; top: 24px; left: 24px; font-size: 20px; color: var(--c-accent); }
.step .cap {
  position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: calc(100% - 28px);
  text-align: center; font-family: var(--f-step); font-size: 16px; line-height: 18.93px; letter-spacing: -0.16px; color: var(--c-ink-soft);
}
.step .done { position: absolute; left: 0; right: 0; bottom: 24px; text-align: center; font-size: 40px; font-weight: 500; color: var(--c-ink-soft); }
.slide .cap {
  position: absolute; z-index: 1; left: 50%; bottom: 24px; transform: translateX(-50%); width: calc(100% - 20px);
  text-align: center; font-family: var(--f-step); font-weight: 400; font-size: 18px; line-height: 18.93px; letter-spacing: -0.18px; color: var(--c-ink-soft);
}
.slide .done { position: absolute; z-index: 1; left: 0; right: 0; bottom: 24px; text-align: center; font-size: 40px; font-weight: 500; color: var(--c-ink-soft); }
.row-title h1 { white-space: nowrap; }

.more { display: flex; flex-direction: column; gap: 20px; padding-bottom: 80px; }
.more .row { display: flex; gap: 8px; overflow-x: auto; margin-right: calc(var(--pad) * -1); padding-right: var(--pad); scroll-snap-type: x proximity; scrollbar-width: none; }
.more .row::-webkit-scrollbar { display: none; }
.more .row .card { flex: 0 0 174px; scroll-snap-align: start; }

.page-bottom { height: 40px; }

/* ===== Просмотр карточки крупно ===== */
.card:not(a) .inner { cursor: zoom-in; }
.zoom-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(240, 240, 240, 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); transition: background .38s ease, backdrop-filter .38s ease, -webkit-backdrop-filter .38s ease; cursor: zoom-out; }
.zoom-overlay.on { background: rgba(240, 240, 240, .94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.zoom-box { position: fixed; z-index: 51; overflow: hidden; border-radius: 16px; background: var(--c-surface); box-shadow: 0 20px 60px rgba(0, 0, 0, 0); transition: box-shadow .38s ease; cursor: zoom-out; }
.zoom-box.on { box-shadow: 0 20px 60px rgba(0, 0, 0, .18); }
.zoom-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; }
.zoom-cap, .zoom-btns { position: fixed; z-index: 52; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; align-items: center; opacity: 0; transform: translateY(8px); transition: opacity .3s ease .12s, transform .3s ease .12s; pointer-events: none; }
.zoom-cap.on, .zoom-btns.on { opacity: 1; transform: none; }
.zoom-cap { height: 30px; pointer-events: auto; padding: 0 16px; align-items: baseline; } /* текст в таблетке стоит на одной базовой линии с названием */
.zoom-cap .chip { align-self: auto; }
.zoom-name { font-size: 24px; line-height: 1.1; color: var(--c-ink); white-space: nowrap; min-width: 0; }
/* «Сделано» в просмотре — форма как у табов меню, цвета как у тега на карточке */
.zoom-done { display: inline-flex; align-items: center; gap: 8px; flex: none; height: 30px; padding: 0 8px; border-radius: var(--r-pill); background: var(--c-surface); font-size: 16px; font-weight: 400; color: var(--c-ink); cursor: pointer; transition: background .2s ease, color .2s ease; }
.zoom-done .t { line-height: 1; display: none; }
.zoom-done:not(.on) { min-width: 30px; padding: 0; justify-content: center; }
.zoom-done.on .t { display: inline; }
.zoom-done svg path { stroke: #c8c8c8; }
.zoom-done.on { background: var(--c-accent); color: #fff; }
.zoom-done.on svg path { stroke: #fff; }
.zoom-btns { height: 36px; gap: 8px; pointer-events: auto; opacity: 0; transform: translateY(8px); transition: opacity .3s ease .16s, transform .3s ease .16s; }
.zoom-btns .ic { width: 36px; height: 36px; }
.zoom-btns .done-btn { position: static; height: 36px; min-width: 36px; border-radius: 18px; }
.zoom-btns .done-btn.on { padding: 0 12px; }
.zoom-close { position: fixed; z-index: 52; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--c-surface); display: grid; place-items: center; opacity: 0; transition: opacity .3s ease .12s; }
.zoom-close.on { opacity: 1; }
body.zooming { overflow: hidden; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

  }
  function jobFor(btn) {
    var card = btn.closest(".card") || (btn.closest(".zoom-btns") || {}).__card;
    if (card) return cardJob(card);
    var key = (location.hash || "").slice(1);
    if (btn.closest(".title-row") && ORIGAMI[key]) return { origami: origamiSheets(key) };
    if (btn.closest(".actions")) {
      var c = catById(key), pages = [];
      app.querySelectorAll(".masonry .card").forEach(function (el) { var j = cardJob(el); if (j && j.pages) pages = pages.concat(j.pages); });
      return pages.length ? { title: (c ? c.name : "WB Дети") + " — все", pages: pages } : null;
    }
    return null;
  }

  function loadImg(src) { return new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = src; }); }
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  var pdfLib = null;
  function getPdf() { return pdfLib || (pdfLib = loadScript("js/jspdf.umd.min.js").then(function () { return window.jspdf.jsPDF; })); }

  // Лист шага оригами: картинка + подпись под ней (подпись рисуем сами — так кириллица точно на месте)
  function stepCanvas(im, cap) {
    var W = 720, pad = 18, fs = 34, ctx0 = document.createElement("canvas").getContext("2d");
    ctx0.font = fs + "px 'WB Sans', Onest, sans-serif";
    var words = cap.split(" "), lines = [], line = "";
    words.forEach(function (w) { var t = line ? line + " " + w : w; if (ctx0.measureText(t).width > W - pad * 2 && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line);
    var ih = Math.round(im.naturalHeight * W / im.naturalWidth), H = ih + pad + lines.length * (fs + 8) + pad;
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.drawImage(im, 0, 0, W, ih);
    g.fillStyle = "#000"; g.font = ctx0.font; g.textAlign = "center"; g.textBaseline = "top";
    lines.forEach(function (l, i) { g.fillText(l, W / 2, ih + pad + i * (fs + 8)); });
    return cv;
  }
  function flat(im) { var cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight; var g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0); return cv; }

  // PDF A4: картинка по центру листа с полями 10 мм; оригами — сетка 3×4 шагов с подписями
  function buildPdf(job) {
    return getPdf().then(function (jsPDF) {
      var doc = new jsPDF({ unit: "mm", format: "a4" }), PW = 210, PH = 297, M = 10;
      function put(cv, x, y, w, h) {
        var r = Math.min(w / cv.width, h / cv.height), dw = cv.width * r, dh = cv.height * r;
        doc.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
      }
      if (job.origami) {
        return Promise.all(job.origami.steps.map(function (s) { return loadImg(s.src).then(function (im) { return stepCanvas(im, s.cap); }); })).then(function (cvs) {
          var cols = 3, rows = 4, gw = (PW - M * 2) / cols, gh = (PH - M * 2) / rows;
          cvs.forEach(function (cv, i) {
            var p = i % (cols * rows); if (i && !p) doc.addPage();
            put(cv, M + (p % cols) * gw + 2, M + Math.floor(p / cols) * gh + 2, gw - 4, gh - 4);
          });
          return { doc: doc, name: job.origami.title };
        });
      }
      return Promise.all(job.pages.map(function (p) { return loadImg(p.src).then(flat); })).then(function (cvs) {
        cvs.forEach(function (cv, i) { if (i) doc.addPage(); put(cv, M, M, PW - M * 2, PH - M * 2); });
        return { doc: doc, name: job.title };
      });
    });
  }

  function saveBlob(blob, name) {
    var a = document.createElement("a"), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 30000);
  }
  function own(job) { return job && job.pages && job.pages.length === 1 && FILES[job.pages[0].base]; }

  function doDownload(job) {
    var f = own(job);
    if (f) { var a = document.createElement("a"); a.href = f; a.download = f.split("/").pop(); document.body.appendChild(a); a.click(); a.remove(); return Promise.resolve(); }
    return buildPdf(job).then(function (r) { saveBlob(r.doc.output("blob"), "WB Дети — " + safeName(r.name) + ".pdf"); });
  }
  function doPrint(job) {
    var f = own(job);
    if (f) { window.open(f, "_blank"); return Promise.resolve(); }
    return buildPdf(job).then(function (r) {
      var u = URL.createObjectURL(r.doc.output("blob"));
      var fr = document.createElement("iframe"); fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
      fr.src = u; document.body.appendChild(fr);
      fr.onload = function () {
        setTimeout(function () {
          try { fr.contentWindow.focus(); fr.contentWindow.print(); }
          catch (e) { window.open(u, "_blank"); } // телефоны: открываем PDF, печать оттуда
        }, 300);
      };
      setTimeout(function () { fr.remove(); URL.revokeObjectURL(u); }, 120000);
    });
  }

  var busy = false;
  document.addEventListener("click", function (e) {
    var b = e.target.closest('.ic[aria-label="Скачать"], .ic[aria-label="Распечатать"], .actions .btn'); if (!b) return;
    e.preventDefault();
    var job = jobFor(b); if (!job || busy) return;
    var isPrint = /Распечатать/.test(b.getAttribute("aria-label") || "");
    busy = true; b.classList.add("loading");
    (isPrint ? doPrint(job) : doDownload(job))
      .catch(function () { alert("Не получилось подготовить файл. Попробуйте ещё раз."); })
      .then(function () { busy = false; b.classList.remove("loading"); });
  }, true);

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
